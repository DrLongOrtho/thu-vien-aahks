@import url("./tokens.css");

/* skip link */

.i { flex: none; width: 1em; height: 1em; }

/* header */
.top { position: sticky; top: 0; z-index: var(--z-sticky-nav); background: var(--color-surface); border-bottom: var(--rule-hair) solid var(--color-rule); }
.top-in { display: flex; align-items: center; gap: var(--space-lg); min-height: var(--header-h); }

.more { display: flex; align-items: center; justify-content: center; gap: var(--space-xs); width: 100%; min-height: 48px; border: 0; border-top: var(--rule-hair) solid var(--color-rule); background: var(--color-surface); color: var(--color-accent); font-weight: 600; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out); }
.more:hover { background: var(--color-accent-soft); }
.more:active { transform: translateY(1px); }
.more:disabled { opacity: 0.55; cursor: not-allowed; }
.more:focus-visible { outline-offset: -3px; }
.empty { padding: var(--space-3xl) 0; text-align: center; color: var(--color-muted); }
.empty a { color: var(--color-accent); font-weight: 600; }

/* talk view */
.player { position: relative; aspect-ratio: 16 / 9; margin-top: var(--space-md); border-radius: var(--radius-card); background: var(--color-player); overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.soonbox { display: grid; place-items: center; text-align: center; background: var(--color-paper-3); }
.soonbox div { display: flex; flex-direction: column; gap: var(--space-xs); max-width: 420px; padding: var(--space-lg); }
.soonbox b { font: var(--display-weight) var(--text-xl)/1.2 var(--font-display); color: var(--color-head); }
.soonbox span { color: var(--color-ink-2); }
.note { margin-top: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); }
.vh h1 { max-width: 40ch; font-size: var(--text-2xl); line-height: 1.2; color: var(--color-head); }
.vh .en { margin-top: var(--space-xs); color: var(--color-muted); }
.vmain > .meta { margin-top: var(--space-md); }
.vmain #main { margin-top: var(--space-xl); }
.wtag { display: inline-block; margin-right: var(--space-xs); padding: 0 var(--space-xs); border-radius: var(--radius-pill); background: var(--color-accent-soft); color: var(--color-accent); font-size: var(--text-sm); vertical-align: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-lg); }
.btn { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 40px; padding: 0 var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-ink); font-size: var(--text-sm); font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
.btn .i { width: 16px; height: 16px; }
.btn.p { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-ink); }
.btn.p:hover { border-color: var(--color-accent-hover); background: var(--color-accent-hover); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--space-xl); align-items: start; margin: var(--space-md) 0 var(--space-2xl); }
.cols aside { padding-top: var(--space-2xs); }
.panel { margin-bottom: var(--space-md); padding: var(--space-lg); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-surface); color: var(--color-ink); }
.panel h2 { margin-bottom: var(--space-sm); font-size: var(--text-lg); line-height: 1.25; color: var(--color-head); }
.panel ul { margin: 0; padding-left: var(--space-lg); }
.panel li { margin-block: var(--space-xs); }
.panel li::marker { color: var(--brand-green); }
.sumlist { max-width: 60ch; line-height: 1.6; }
.plist a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--space-xs); padding: var(--space-xs); border-top: var(--rule-hair) solid var(--color-rule); text-decoration: none; transition: background-color var(--dur-short) var(--ease-out); }
.plist a:first-child { border-top: 0; }
.plist a:hover { background: var(--color-accent-soft); }
.plist a:focus-visible { outline-offset: -2px; }
.plist a[aria-current="true"] { border-radius: var(--radius-thumb); background: var(--color-accent-soft); font-weight: 600; }
.plist .n { color: var(--color-muted); text-align: right; font-variant-numeric: tabular-nums; }
.plist small, .rn { display: flex; flex-wrap: wrap; gap: 0 var(--space-sm); font-size: var(--text-sm); font-weight: 400; color: var(--color-muted); }
.people { margin: 0; padding: 0; list-style: none; }
.panel .people li { display: flex; justify-content: space-between; gap: var(--space-sm); margin: 0; padding-block: var(--space-xs); border-top: var(--rule-hair) solid var(--color-rule); }
.panel .people li:first-child { border-top: 0; }
.people span { font-size: var(--text-sm); color: var(--color-muted); text-align: right; }

/* search */
.res { display: block; margin-bottom: var(--space-sm); padding: var(--space-md) var(--space-lg); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-surface); text-decoration: none; transition: background-color var(--dur-short) var(--ease-out); }
.res:hover { background: var(--color-accent-soft); }
.res .crumb { margin-bottom: var(--space-2xs); }
.res b { display: block; margin-block: var(--space-2xs); font-weight: 600; }
mark { padding: 0 var(--space-3xs); border-radius: var(--space-2xs); background: var(--color-mark); color: inherit; }

/* footer */
.foot { position: relative; isolation: isolate; overflow: hidden; margin-top: var(--space-2xl); background: var(--brand-indigo); color: var(--brand-cream); }
.foot-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-lg); align-items: center; padding-block: var(--space-2xl); }
.foot .logo { width: 84px; height: 84px; }
.foot-t b { display: block; font: var(--display-weight) var(--text-xl)/1.25 var(--font-display); }
.foot-t p { margin-top: var(--space-2xs); max-width: 60ch; color: var(--brand-cream-2); }
.foot-art { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.foot-art i { position: absolute; display: block; border-radius: var(--radius-pill); }
.foot-art i:nth-child(1) { width: 300px; height: 112px; right: 80px; top: -40px; background: var(--brand-cyan); }
.foot-art i:nth-child(2) { width: 112px; height: 112px; right: 0; top: -40px; border-radius: 50%; background: var(--brand-lilac); mix-blend-mode: multiply; }
.foot-art i:nth-child(3) { width: 36px; height: 36px; right: 220px; bottom: 28px; border-radius: 50%; background: var(--brand-yellow); }

#toast { position: fixed; left: 50%; bottom: var(--space-lg); z-index: var(--z-toast); transform: translateX(-50%); padding: var(--space-xs) var(--space-md); border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-sm); opacity: 0; pointer-events: none; transition: opacity var(--dur-short) var(--ease-out); }
#toast.on { opacity: 1; }

@media (max-width: 1100px) {
  .band-in { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
  .intro h1 { max-width: 18ch; }
  .facts { margin-top: var(--space-xs); }
  .fm-in { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .days { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .head-art { display: none; }
  .foot-art i:nth-child(1) { width: 180px; right: 40px; }
}
@media (max-width: 720px) {
  :root { --text-display: 2.074rem; --text-display-s: 1.728rem; --text-section: 1.44rem; --tracks-top: var(--space-3xs); }
  .top { position: relative; }
  .top-in { flex-wrap: wrap; row-gap: var(--space-sm); padding-block: var(--space-sm); }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .brand { flex: 1 1 0; }
  .brand .logo { width: 44px; height: 44px; }
  .brand-t b { font-size: var(--text-lg); }
  .brand-t small { font-size: var(--text-xs); text-wrap: balance; }
  .band { padding-top: var(--space-lg); }
  .band-in { gap: var(--space-md); }
  .intro { display: contents; }
  .mosaic { order: 1; margin-block: var(--space-xs) var(--space-md); }
  .facts, .status { order: 2; }
  .vh h1 { font-size: var(--text-xl); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--space-md); }
  .facts div:nth-child(3) { padding-left: 0; border-left: 0; }
  .mosaic { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(132px, auto); }
  .t0, .t1, .t2 { grid-column: 1 / 3; grid-row: auto; min-height: 168px; }
  .t3, .t4, .t5, .t6 { grid-column: auto; grid-row: auto; }
  .t0 .tn, .t1 .tn { font-size: var(--text-xl); }
  .tile { padding: var(--space-md); }
  .bars a { grid-template-columns: minmax(0, 1fr) auto auto; row-gap: var(--space-xs); }
  .bars .bar { grid-column: 1 / -1; grid-row: 2; }
  .talk { grid-template-columns: 96px minmax(0, 1fr); gap: var(--space-sm); padding: var(--space-sm) var(--space-md); }
  .talk .n { display: none; }
  .talk img, .talk .ph { width: 96px; }
  .talk .d { grid-column: 2; }
  .sh { padding: var(--space-md); }
  .foot-in { grid-template-columns: minmax(0, 1fr); }
  .foot .logo { width: 64px; height: 64px; }
}
</style>
</head>
<body>
<a class="skip" href="#app">Bỏ qua, tới nội dung</a>
<header class="top"><div class="container top-in">
  <a class="brand" href="#/" aria-label="Trang chủ thư viện AAHKS 2026">
    <img class="logo" src="logo.png" width="192" height="192" alt="">
    <span class="brand-t"><b>AAHKS 2026</b><small>Lưu hành nội bộ cho các bác sĩ CTCH BVQY 175</small></span>
  </a>
  <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" name="q" placeholder="Tìm bài giảng, diễn giả, nội dung…" autocomplete="off" aria-label="Tìm kiếm"></label>
  <button class="theme" id="theme" type="button" aria-label="Đổi giao diện sáng/tối">
    <svg class="i moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg class="i sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div></header>
<nav class="tracks" aria-label="Cách xem: chuyên đề, ngày, hình thức"><div class="container" id="tracks"></div></nav>
<main id="app" tabindex="-1"><div class="container empty" role="status">Đang tải thư viện…</div><noscript><div class="container empty">Trang cần bật JavaScript để hiển thị thư viện.</div></noscript></main>
<footer class="foot">
  <span class="foot-art" aria-hidden="true"><i></i><i></i><i></i></span>
  <div class="container foot-in">
    <img class="logo" src="logo.png" width="192" height="192" alt="Logo Bệnh viện Quân y 175">
    <div class="foot-t" id="foot"><b>Phiên dịch, biên soạn bởi Bs. Hoàng Trọng Bảo Long</b><p>Bản quyền nội dung thuộc AAHKS và các diễn giả. Lưu hành nội bộ cho các bác sĩ CTCH BVQY 175.</p></div>
  </div>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const nice = s => String(s ?? "").replace(/\s+[–—]\s+/g, " và ");          // nhãn hiển thị: "Công nghệ – AI" → "Công nghệ và AI" (đường dẫn giữ nguyên)
const clock = s => { s = Math.floor(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const hrs = s => { const h = s/3600; return h < 10 ? h.toLocaleString("vi-VN",{maximumFractionDigits:1}) : Math.round(h).toLocaleString("vi-VN"); };
const store = { get(k, d){ try { const v = localStorage.getItem("tv." + k); return v == null ? d : v; } catch(e) { return d; } },
                set(k, v){ try { localStorage.setItem("tv." + k, v); } catch(e) {} } };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800); };
const enc = encodeURIComponent;
const ICON = {
  next: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  prev: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ext: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3L7.5 8.5M12 9.5V13H3V4h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  link: '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-.9.9M9.2 6.8a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l.9-.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
const SEP = `<span class="sep">${ICON.next}</span>`;

let CAT = null, SES = {}, listScroll = {}, openS = new Set();
const th = store.get("theme", ""); if (th) document.documentElement.dataset.theme = th;
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme);
};

function route(){ const h = decodeURIComponent(location.hash.replace(/^#\/?/, "")); const [path, qs] = h.split("?");
  return { parts: (path || "").split("/").filter(Boolean), q: new URLSearchParams(qs || "").get("q") || "" }; }
const MODES = {cd: "Chuyên đề", hn: "Theo ngày", ht: "Hình thức"};
let navMode = store.get("mode", "cd");
const values = m => m === "cd" ? CAT.tracks : m === "hn" ? CAT.courses : CAT.formats;
function inGroup(m, v){                      // → [[phiên, [số thứ tự bài thuộc nhóm]], …]
  return CAT.sessions.map(s => {
    if (m === "cd" && !s.tr.includes(v)) return null;
    if (m === "hn" && s.c !== v) return null;
    let idx = s.items.map((_, i) => i);
    if (m === "ht") { idx = idx.filter(i => s.items[i].f === v); if (!idx.length) return null; }
    return [s, idx]; }).filter(Boolean);
}
const ikey = it => it.v + "@" + it.s;            // 1 bài có thể nằm ở nhiều nhóm → đếm 1 lần
const uniq = L => { const m = new Map(); L.forEach(([s, idx]) => idx.forEach(i => m.set(ikey(s.items[i]), s.items[i]))); return [...m.values()]; };
const countL = L => uniq(L).length;
const durL = L => uniq(L).reduce((a, it) => a + it.d, 0);
const link = (m, v, s, i) => `#/${m}/${enc(v)}/${s.k}` + (i == null ? "" : `/${i}`);
const COUNT = {};
const DAYG = [3, 2, 1];                          // màu ngày: vàng, xanh lá, xanh lơ
const groupClass = (m, v) => { const i = values(m).indexOf(v); return i < 0 ? "g1" : "g" + (m === "hn" ? DAYG[i % 3] : i % 7); };
const metaList = xs => `<ul class="meta">${xs.filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
function splitTitle(t){ const i = t.indexOf(": "); return i > 0 && i < 24 ? [t.slice(0, i), t.slice(i + 2)] : [t, ""]; }
function startOf(s){ const day = s.tm.slice(0, 4); const t = s.items.map(x => x.tm).filter(x => x && x.slice(0, 4) === day).sort()[0] || s.tm;
  return t.slice(4, 6) + ":" + t.slice(6, 8); }

function navBar(m, cur){
  navMode = m || navMode;
  $("#tracks").innerHTML = `<span class="modes" role="tablist">${Object.entries(MODES).map(([k, lab]) =>
      `<button class="md" type="button" role="tab" data-m="${k}" aria-selected="${k === navMode}">${lab}</button>`).join("")}</span>` +
    values(navMode).map(v => `<a class="tk" href="#/${navMode}/${enc(v)}" ${v === cur ? 'aria-current="page"' : ""}>${esc(nice(v))}<small>${COUNT[navMode][v]}</small></a>`).join("");
  document.querySelectorAll(".md").forEach(b => b.onclick = () => { navMode = b.dataset.m; store.set("mode", navMode); navBar(navMode, ""); });
  const a = $("#tracks [aria-current]"); if (a) a.scrollIntoView({block:"nearest", inline:"center"});
  fadeEnd();
}
const fadeEnd = () => { const c = $("#tracks"); c.classList.toggle("end", c.scrollLeft + c.clientWidth >= c.scrollWidth - 4); };
$("#tracks").addEventListener("scroll", fadeEnd, {passive: true});
addEventListener("resize", fadeEnd);

function talkRow(m, v, s, i, n){
  const it = s.items[i];
  return `<a class="talk${it.g ? "" : " soon"}" href="${link(m, v, s, i)}"><span class="n">${n+1}</span>
    ${it.th ? `<img loading="lazy" src="${esc(it.th)}" width="320" height="180" alt="">` : `<span class="ph"></span>`}
    <span><b>${it.g ? "" : '<span class="stag">Sắp có</span>'}${esc(it.t)}</b><span class="en">${esc(it.e)}</span>${it.p.length ? `<span class="who">${esc(it.p.join(", "))}</span>` : ""}</span>
    <span class="d">${clock(it.d)}</span></a>`;
}
function sessionCard(m, v, s, idx){
  const d = idx.reduce((a, i) => a + s.items[i].d, 0), many = idx.length > 12 && !openS.has(s.k);
  const tags = [m !== "ht" && s.f && s.f !== s.e ? nice(s.f) : "", m === "hn" ? "" : s.c, idx.length + " bài", clock(d)];
  return `<section class="session" id="${s.k}"><div class="sh"><h3>${esc(s.t)}</h3>${s.e !== s.t ? `<div class="en">${esc(s.e)}</div>` : ""}
    ${metaList(tags)}</div>
    ${idx.slice(0, many ? 10 : 1e9).map((i, n) => talkRow(m, v, s, i, n)).join("")}
    ${many ? `<button class="more" type="button" data-open="${s.k}">Xem tất cả ${idx.length} bài ${ICON.down}</button>` : ""}</section>`;
}

function home(){
  navBar(navMode, "");
  const all = CAT.sessions.map(s => [s, s.items.map((_, i) => i)]);
  const tiles = CAT.tracks.map((v, i) => { const L = inGroup("cd", v);
    return `<a class="tile t${i} g${i % 7}" href="#/cd/${enc(v)}"><span class="art" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="tn">${esc(nice(v))}</span><span class="tm"><b>${countL(L)}</b> bài giảng<br>${hrs(durL(L))} giờ video</span></a>`; }).join("");
  const days = CAT.courses.map((c, i) => { const L = inGroup("hn", c);
    const [wd, dm = ""] = c.split(", "), [num, ...rest] = dm.split(" ");
    return `<article class="day g${DAYG[i % 3]}">
      <a class="day-h" href="#/hn/${enc(c)}"><span class="dnum">${esc(num)}</span><span><b>${esc(wd)}</b><small>${esc(rest.join(" "))}, ${countL(L)} bài giảng, ${hrs(durL(L))} giờ</small></span></a>
      <ol class="slots">${L.map(([s]) => { const [lab, sub] = splitTitle(s.t);
        return `<li><a href="#/hn/${enc(c)}/${s.k}"><time>${startOf(s)}</time><span><b>${esc(lab)}</b>${sub ? `<span class="x">${esc(sub)}</span>` : ""}</span><span class="c">${s.items.length} bài</span></a></li>`; }).join("")}</ol>
    </article>`; }).join("");
  const fl = CAT.formats.map(f => [f, inGroup("ht", f)]), fmax = Math.max(...fl.map(([, L]) => countL(L)));
  const bars = fl.map(([f, L]) => { const n = countL(L);
    return `<li><a href="#/ht/${enc(f)}"><span class="bn">${esc(nice(f))}</span><span class="bar" aria-hidden="true"><i style="--w:${(n / fmax).toFixed(3)}"></i></span><span class="bv"><b>${n}</b> bài</span><span class="bh">${hrs(durL(L))} giờ</span></a></li>`; }).join("");
  $("#app").innerHTML = `
    <section class="band"><div class="container band-in">
      <div class="intro">
        <h1>Thư viện bài giảng AAHKS 2026</h1>
        <p class="lead">Hội nghị thường niên Hội Phẫu thuật viên Khớp háng và Khớp gối Hoa Kỳ (AAHKS).</p>
        <p class="byline">Phiên dịch, biên soạn bởi Bs. Hoàng Trọng Bảo Long</p>
        <dl class="facts">
          <div><dt>bài giảng</dt><dd>${CAT.total}</dd></div>
          <div><dt>giờ video</dt><dd>${hrs(durL(all))}</dd></div>
          <div><dt>phiên</dt><dd>${CAT.sessions.length}</dd></div>
          <div><dt>ngày hội nghị</dt><dd>${CAT.courses.length}</dd></div>
        </dl>
        <p class="status">${CAT.ready === CAT.total ? "Đã có đủ phụ đề tiếng Việt." : CAT.ready ? `Đã có phụ đề ${CAT.ready}/${CAT.total} bài, các bài còn lại đang được dịch.` : "Phụ đề tiếng Việt đang được dịch."}</p>
      </div>
      <nav class="mosaic" aria-label="Chuyên đề">${tiles}</nav>
    </div></section>
    <section class="program"><div class="container">
      <div class="sec-h"><h2>Chương trình theo ngày</h2></div>
      <div class="days">${days}</div>
    </div></section>
    <section class="formats"><div class="container fm-in">
      <div class="sec-h"><h2>Hình thức trình bày</h2><p>Mỗi hình thức gom các bài cùng kiểu, theo thứ tự chương trình.</p></div>
      <ol class="bars">${bars}</ol>
    </div></section>`;
}

function listView(m, v, focus){
  navBar(m, v);
  const L = inGroup(m, v), key = "loc." + m + "." + v;
  let f = {}; try { f = JSON.parse(store.get(key, "{}")); } catch(e) {}
  // bộ lọc phụ: chủ đề con (chuyên đề), ngày (chuyên đề / hình thức), chuyên đề (theo ngày)
  const topics = m === "cd" ? (CAT.topics[v] || []) : [];
  const courses = m !== "hn" ? CAT.courses.filter(c => L.some(([s]) => s.c === c)) : [];
  const tracks = m === "hn" ? CAT.tracks.filter(t => L.some(([s]) => s.tr.includes(t))) : [];
  if (f.tp && !topics.includes(f.tp)) f.tp = ""; if (f.c && !courses.includes(f.c)) f.c = ""; if (f.t && !tracks.includes(f.t)) f.t = "";
  const shown = L.filter(([s]) => (!f.tp || s.tp.some(([t, tp]) => t === v && tp === f.tp)) && (!f.c || s.c === f.c) && (!f.t || s.tr.includes(f.t)));
  const chips = (name, list, all) => list.length > 1 ? `<div class="courses">${[["", all], ...list.map(x => [x, x])].map(([x, lab]) =>
      `<button class="cs" type="button" data-k="${name}" data-v="${esc(x)}" aria-pressed="${(f[name] || "") === x}">${esc(nice(lab))}</button>`).join("")}</div>` : "";
  const groups = m === "hn" ? [v] : courses;
  const gOf = s => s.c;
  let nSes = 0;
  const body = groups.map(g => { const seen = new Set();
        const G = shown.filter(([s]) => gOf(s) === g).map(([s, idx]) => [s, idx.filter(i => !seen.has(ikey(s.items[i])) && seen.add(ikey(s.items[i])))])
                       .filter(([s, idx]) => idx.length);
        nSes += G.length;
        return G.length ? (m === "hn" ? "" : `<h2 class="course">${esc(g)}</h2>`) + G.map(([s, idx]) => sessionCard(m, v, s, idx)).join("") : ""; }).join("");
  $("#app").innerHTML = `<div class="container"><div class="head"><span class="head-art ${groupClass(m, v)}" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="crumb"><a href="#/">Thư viện</a>${SEP}<span>${MODES[m]}</span></div>
      <h1>${esc(nice(v))}</h1><p class="stats">${countL(shown)} bài giảng, ${nSes} phiên, ${hrs(durL(shown))} giờ video</p>
      ${chips("tp", topics, "Mọi chủ đề")}${chips("c", courses, "Mọi ngày")}${chips("t", tracks, "Mọi chuyên đề")}</div>
    ${body || `<div class="empty">Chưa có bài giảng trong mục này. <a href="#/">Về thư viện</a></div>`}</div>`;
  document.querySelectorAll(".cs").forEach(b => b.onclick = () => { f[b.dataset.k] = b.dataset.v; store.set(key, JSON.stringify(f)); listView(m, v); });
  document.querySelectorAll(".more").forEach(b => b.onclick = () => { openS.add(b.dataset.open); const y = scrollY; listView(m, v); scrollTo(0, y); });
  if (focus) { const el = document.getElementById(focus); if (el) { el.scrollIntoView({block:"start"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); } }
}

async function talkView(m, v, k, i){
  const s = SES[k]; i = +i;
  if (!s || !s.items[i]) { $("#app").innerHTML = `<div class="container empty">Không tìm thấy bài giảng. <a href="#/">Về thư viện</a></div>`; return; }
  navBar(m, v);
  const it = s.items[i], start = it.s > 0 ? `?t=${Math.floor(it.s)}` : "";
  const idx = m === "ht" ? s.items.map((_, j) => j).filter(j => s.items[j].f === v) : s.items.map((_, j) => j);
  const pos = idx.indexOf(i);
  document.title = it.t + " · AAHKS 2026";
  const prev = pos > 0 ? link(m, v, s, idx[pos-1]) : "", next = pos >= 0 && pos < idx.length - 1 ? link(m, v, s, idx[pos+1]) : "";
  const step = (href, inner) => href ? `<a class="btn" href="${href}">${inner}</a>` : `<span class="btn" aria-disabled="true">${inner}</span>`;
  $("#app").innerHTML = `<div class="container">
    <div class="head tight"><div class="crumb"><a href="#/">Thư viện</a>${SEP}<span>${MODES[m]}</span>${SEP}
      <a href="#/${m}/${enc(v)}">${esc(nice(v))}</a>${m !== "hn" ? `${SEP}<span>${esc(s.c)}</span>` : ""}${SEP}<a href="${link(m, v, s)}">${esc(s.t)}</a></div></div>
    <div class="cols"><div class="vmain">
      <div class="vh"><h1>${it.w ? '<span class="wtag">Cả phiên</span>' : ""}${esc(it.t)}</h1><div class="en">${esc(it.e)}</div></div>
      ${it.g ? `<div class="player"><iframe src="https://drive.google.com/file/d/${it.g}/preview${start}" allow="autoplay; fullscreen" allowfullscreen title="${esc(it.t)}"></iframe></div>` : `<div class="player soonbox"><div><b>Sắp có</b><span>Bài này đang được dịch phụ đề tiếng Việt và sẽ có trong thời gian tới.</span></div></div>`}
      ${it.s > 0 ? `<p class="note">Bài này bắt đầu ở phút ${clock(it.s)} của video ghi cả phiên. Nếu video không tự nhảy tới, hãy kéo thanh thời gian tới ${clock(it.s)} hoặc mở trên Drive.</p>` : ""}
      ${metaList([s.c, nice(it.f), ...s.tr.filter(t => t !== "Khác").map(nice), `Bài ${pos+1}/${idx.length} của phiên`, clock(it.d)])}
      <div class="actions">${step(prev, `${ICON.prev}Bài trước`)}${step(next, `Bài tiếp theo${ICON.next}`)}
        ${it.g ? `<a class="btn p" href="https://drive.google.com/file/d/${it.g}/view${start}" target="_blank" rel="noopener">Mở trên Google Drive${ICON.ext}</a>` : ""}
        <button class="btn" id="share" type="button">${ICON.link}Sao chép link</button></div>
      <div id="main"></div></div>
    <aside>
      <div class="panel"><h2>Các bài trong phiên (${idx.length})</h2><div class="plist">${idx.map((j, n) => { const x = s.items[j];
        return `<a href="${link(m, v, s, j)}" aria-current="${j===i}"><span class="n">${n+1}</span><span>${x.g ? "" : '<span class="stag">Sắp có</span>'}${esc(x.t)}<small>${x.p.length ? `<span>${esc(x.p.join(", "))}</span>` : ""}<span>${clock(x.d)}</span></small></span></a>`; }).join("")}</div></div>
      <div id="spk"></div></aside></div></div>`;
  $("#share").onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast("Đã sao chép link bài này"); } catch(e) { prompt("Link:", location.href); } };
  let d = { sum: [], spk: [] };
  try { d = await (await fetch(`data/v/${it.v}.json`)).json(); } catch(e) {}
  if (route().parts.slice(-2).join("/") !== [k, String(i)].join("/")) return;
  const whole = s.items.filter(x => x.v === it.v).length > 1 || it.ch;
  $("#main").innerHTML = d.sum.length ? `<div class="panel"><h2>${whole ? "Nội dung chính của cả phiên" : "Nội dung chính"}</h2><ul class="sumlist">${d.sum.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p class="note">Tóm tắt do AI tạo từ lời giảng.</p></div>` : "";
  const ps = it.p.length ? d.spk.filter(p => it.p.includes(p.n)) : d.spk;
  $("#spk").innerHTML = ps.length ? `<div class="panel"><h2>Diễn giả</h2><ul class="people">${ps.map(p => `<li>${esc(p.n)}<span>${esc(p.c)}</span></li>`).join("")}</ul></div>` : "";
}

function hl(text, words){ let out = esc(text); words.forEach(w => { if (w.length < 2) return;
  const f = fold(text), i = f.indexOf(w); if (i >= 0) out = esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + w.length)) + "</mark>" + esc(text.slice(i + w.length)); }); return out; }
function search(q){
  navBar(navMode, "");
  const ws = fold(q).trim().split(/\s+/).filter(Boolean), res = [];
  CAT.sessions.forEach(s => s.items.forEach((it, i) => { if (ws.every(w => it._f.includes(w) || s._f.includes(w))) res.push([s, it, i]); }));
  $("#app").innerHTML = `<div class="container"><div class="head"><h1>Kết quả cho “${esc(q)}”</h1><p class="stats">${res.length} bài giảng</p></div>` +
    (res.length ? res.slice(0, 200).map(([s, it, i]) => `<a class="res" href="${link("cd", s.tr[0], s, i)}"><div class="crumb"><span>${esc(nice(s.tr[0]))}</span>${SEP}<span>${esc(s.c)}</span>${SEP}<span>${esc(s.t)}</span></div>
      <b>${hl(it.t, ws)}</b><span class="rn"><span>${esc(it.e)}</span>${it.p.length ? `<span>${esc(it.p.join(", "))}</span>` : ""}<span>${clock(it.d)}</span></span></a>`).join("") : `<div class="empty">Không tìm thấy bài giảng phù hợp. Thử từ khóa ngắn hơn, hoặc <a href="#/">về thư viện</a>.</div>`) + `</div>`;
}

let last = "";
function render(){
  let { parts, q } = route();
  if (parts.length && !MODES[parts[0]]) parts = ["cd", ...parts];          // link cũ dạng #/<chuyên đề>/…
  const key = parts.join("/");
  if (last && last.split("/").length === 2 && key !== last) listScroll[last] = scrollY;
  if (q) { search(q); }
  else if (!parts.length) { document.title = "AAHKS 2026 · Lưu hành nội bộ CTCH BVQY 175"; home(); }
  else if (parts.length === 1) { navMode = parts[0]; home(); }
  else if (parts.length === 2) { document.title = nice(parts[1]) + " · AAHKS 2026"; listView(parts[0], parts[1]); scrollTo(0, listScroll[key] || 0); }
  else if (parts.length === 3) { listView(parts[0], parts[1], parts[2]); }
  else { talkView(parts[0], parts[1], parts[2], parts[3]); scrollTo(0, 0); }
  last = key;
}
let qT;
$("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => {
  const v = e.target.value.trim(); history.replaceState(null, "", v ? "#/?q=" + enc(v) : "#/"); render(); }, 200); });

fetch("data/catalog.json").then(r => r.json()).then(j => {
  CAT = j;
  CAT.sessions.forEach(s => { SES[s.k] = s; s._f = fold([s.t, s.e, s.c, s.tr.join(" "), s.f, s.tp.map(x => x[1]).join(" ")].join(" "));
    s.items.forEach(it => it._f = fold([it.t, it.e, it.p.join(" "), it.m, it.f].join(" "))); });
  for (const m of Object.keys(MODES)) { COUNT[m] = {}; values(m).forEach(v => COUNT[m][v] = countL(inGroup(m, v))); }
  $("#foot").innerHTML = `<b>Phiên dịch, biên soạn bởi Bs. Hoàng Trọng Bảo Long</b><p>Bản quyền nội dung thuộc AAHKS và các diễn giả. Lưu hành nội bộ cho các bác sĩ CTCH BVQY 175. Cập nhật ${esc(j.updated)}.</p>`;
  addEventListener("hashchange", render); render();
}).catch(() => { $("#app").innerHTML = `<div class="container empty">Thư viện đang được cập nhật, vui lòng quay lại sau.</div>`; });
</script>
</body>
</html>
